name: kupido

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kupido
      POSTGRES_USER: kupido
      POSTGRES_PASSWORD: kupidosecret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kupido -d kupido"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://kupido:kupidosecret@db:5432/kupido
      SECRET_KEY: change-this-in-production-32-chars-min
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:3000"]'
      MEDIA_DIR: /app/media
    volumes:
      # Каталог фото лежит в репозитории (./backend/media) и коммитится в git:
      # файлы едут с репо, записи в БД восстанавливаются из media/manifest.json
      # при старте. Bind-mount не удаляется флагом `down -v`.
      - ./backend/media:/app/media
    ports:
      - "8000:8000"

  # Сайт и админка собираются в один образ и раздаются одним nginx:
  #   http://localhost/        — клиентский сайт
  #   http://localhost/admin   — админ-панель (вход общий с сайтом)
  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
